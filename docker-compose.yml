services:
  db:
    image: mysql:8.0
    container_name: arvind-gcc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-arvind_gcc}
      MYSQL_USER: ${MYSQL_USER:-gcc_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gcc_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build: .
    container_name: arvind-gcc-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-gcc_user}:${MYSQL_PASSWORD:-gcc_pass}@db:3306/${MYSQL_DATABASE:-arvind_gcc}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      AUTH_ENABLED: ${AUTH_ENABLED:-1}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_REDIRECT_URI: ${AZURE_REDIRECT_URI:-https://faq.arvindgcc.com/auth/callback}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      SESSION_LIFETIME_HOURS: ${SESSION_LIFETIME_HOURS:-8}
      LOG_ADMIN_EMAILS: ${LOG_ADMIN_EMAILS:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
